name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.deploy.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install pytest

      - name: Compile
        run: |
          python -m py_compile app/main.py app/llm/factory.py app/llm/mock_client.py app/llm/demo_resilient_client.py

      - name: Test in mock mode
        env:
          MOCK_MODE: "true"
          BCI_DEMO_MODE: "false"
          LOCAL_BCI_GENERATOR_ENABLED: "false"
        run: python -m pytest -q
