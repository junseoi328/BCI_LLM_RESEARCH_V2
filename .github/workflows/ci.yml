name: CI

on:
  push:
    branches: ["main", "release/**", "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.deploy.txt
          MOCK_MODE=true python -c "import app.main"  # 배포 이미지에 없는 패키지 import 차단
          pip install -r requirements.txt
          pip install pytest

      - name: Compile
        run: |
          python -m py_compile app/main.py app/llm/factory.py app/llm/mock_client.py app/llm/demo_resilient_client.py

      - name: Test in mock mode
        env:
          MOCK_MODE: "true"
          BCI_DEMO_MODE: "false"
          LOCAL_BCI_GENERATOR_ENABLED: "false"
        run: python -m pytest -q tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      # 브라우저 내려받기·apt가 가끔 GitHub 쪽에서 실패한다(v3.8.0 배포가 이것 때문에 멈춤) — 3번까지 다시 시도
      - run: for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep 20; done; exit 1
      - run: npm test
