services:
  - type: web
    name: esimjeonsim-bci-speller
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: checksPass

    envVars:
      - key: OPENAI_API_KEY
        sync: false

      - key: MOCK_MODE
        value: "false"

      - key: BCI_DEMO_MODE
        value: "true"

      - key: LOCAL_BCI_GENERATOR_ENABLED
        value: "false"

      - key: GENERATOR_MODEL
        value: "gpt-5.6-luna"

      - key: RANKER_MODEL
        value: "gpt-5.6-luna"

      - key: GENERATION_COUNT
        value: "16"

      - key: OPENAI_TIMEOUT_SEC
        value: "45"

      - key: OPENAI_MAX_RETRIES
        value: "2"

      - key: ALLOW_LOCAL_FALLBACK
        value: "true"

      - key: DEBUG_MODE
        value: "false"

      - key: PIPELINE_VERSION
        value: "0.6.0-web-deploy"

      - key: GENERATOR_PROMPT_VERSION
        value: "generator-v2+context-diversity-v2"

      - key: RANKER_PROMPT_VERSION
        value: "ranker-v2"
