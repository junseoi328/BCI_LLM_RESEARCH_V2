services:
  - type: web
    name: bci-language-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG_MODE
        value: "false"
      - key: MOCK_MODE
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_GENERATOR_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_RANKER_MODEL
        value: gpt-5.6-luna
      - key: ALLOW_LOCAL_FALLBACK
        value: "true"
      - key: ENABLE_EXPERIMENT_LOG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://YOUR-FRONTEND-DOMAIN.example
